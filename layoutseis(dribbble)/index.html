<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Layout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">Logo</div>
      <nav class="menu">
        <a href="#">Shots</a>
        <a href="#">Explore</a>
        <a href="#">Jobs</a>
      </nav>
      <div class="auth">
        <button>Sign up</button>
        <button>Log in</button>
      </div>
    </header>

    <section class="filters">
      <button>Popular</button>
      <div class="categories">
        <span>Discover</span>
        <span>Animation</span>
        <span>Branding</span>
        <span>Illustration</span>
      </div>
      <button>Filters</button>
    </section>

    <main class="grid">
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
    </main>
  </body>
</html>
